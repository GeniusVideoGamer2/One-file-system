name: GameXWIN Aether Launcher APK
on:
  workflow_dispatch:
  push:
    branches: [gamexwin-android]
    paths:
      - 'android/aether-launcher/**'
      - '.github/workflows/gamexwin-aether-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - name: Build debug launcher APK
        working-directory: android/aether-launcher
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameXWIN-Aether-Launcher-debug
          path: android/aether-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
