name: Build GameXOS Separate Apps
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/gamexos-apps.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK from runner
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate five independent Android projects
        shell: bash
        run: |
          cat > /tmp/create_apps.py <<'PY'
          from pathlib import Path
          import textwrap
          apps={
          "launcher":("GameXOS Launcher","com.gamexos.launcher"),
          "files":("GameXOS Files","com.gamexos.files"),
          "gallery":("GameXOS Gallery","com.gamexos.gallery"),
          "settings":("GameXOS Settings","com.gamexos.settings"),
          "control":("GameXOS Control","com.gamexos.control")
          }
          for kind,(title,pkg) in apps.items():
           root=Path("build-src")/kind
           java=root/"app/src/main/java"/Path(pkg.replace(".","/"))
           java.mkdir(parents=True,exist_ok=True)
           (root/"settings.gradle").write_text("pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name='"+title.replace(" ","")+"'; include ':app'\n")
           (root/"build.gradle").write_text("plugins { id 'com.android.application' version '8.7.3' apply false }\n")
           (root/"app/build.gradle").write_text("plugins { id 'com.android.application' }\nandroid { namespace '"+pkg+"'; compileSdk 35; defaultConfig { applicationId '"+pkg+"'; minSdk 26; targetSdk 28; versionCode 1; versionName '1.0' } }\n")
           manifest=f'<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.NoActionBar" android:label="{title}" android:usesCleartextTraffic="false"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>'
           (root/"app/src/main/AndroidManifest.xml").write_text(manifest)
           src=r'''package PACKAGE;
          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.content.pm.*;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.view.*;
          import android.widget.*;
          import android.net.Uri;
          import java.util.*;
          public class MainActivity extends Activity {
           LinearLayout root;
           int fg=Color.WHITE;
           GradientDrawable bg(int a,int b){GradientDrawable d=new GradientDrawable(GradientDrawable.Orientation.TL_BR,new int[]{a,b});d.setCornerRadius(40);return d;}
           void button(String name,Runnable r){Button b=new Button(this);b.setText(name);b.setAllCaps(false);b.setTextSize(16);b.setTextColor(fg);b.setBackground(bg(0xff39345c,0xff283b65));LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,150);p.setMargins(0,10,0,10);root.addView(b,p);b.setOnClickListener(v->{try{r.run();}catch(Exception e){Toast.makeText(this,"Bu özellik bu cihazda kullanılamıyor",Toast.LENGTH_SHORT).show();}});}
           void launch(String action){startActivity(new Intent(action));}
           void pick(String type){Intent i=new Intent(Intent.ACTION_OPEN_DOCUMENT);i.setType(type);i.addCategory(Intent.CATEGORY_OPENABLE);startActivityForResult(i,1);}
           void create(){Intent i=new Intent(Intent.ACTION_CREATE_DOCUMENT);i.setType("text/plain");i.putExtra(Intent.EXTRA_TITLE,"GameXOS-Not.txt");startActivityForResult(i,2);}
           @Override public void onCreate(Bundle b){super.onCreate(b);ScrollView s=new ScrollView(this);root=new LinearLayout(this);root.setOrientation(1);root.setPadding(28,60,28,35);root.setBackground(bg(0xff10152e,0xff3c205b));s.addView(root);setContentView(s);TextView h=new TextView(this);h.setText("TITLE");h.setTextSize(31);h.setTextColor(fg);h.setPadding(0,0,0,30);root.addView(h);
           switch("KIND"){
           case "launcher":showApps();break;
           case "files":button("Dosya aç",()->pick("*/*"));button("Yeni metin dosyası oluştur",()->create());button("Klasör seç",()->startActivityForResult(new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE),3));break;
           case "gallery":button("Fotoğraf aç",()->pick("image/*"));button("Video aç",()->pick("video/*"));break;
           case "settings":button("Wi-Fi ayarları",()->launch(android.provider.Settings.ACTION_WIFI_SETTINGS));button("Bluetooth ayarları",()->launch(android.provider.Settings.ACTION_BLUETOOTH_SETTINGS));button("Ekran ayarları",()->launch(android.provider.Settings.ACTION_DISPLAY_SETTINGS));button("Uygulama ayarları",()->launch(android.provider.Settings.ACTION_SETTINGS));break;
           case "control":button("İnternet ayarları",()->launch(android.provider.Settings.ACTION_WIRELESS_SETTINGS));button("Bluetooth ayarları",()->launch(android.provider.Settings.ACTION_BLUETOOTH_SETTINGS));button("Ses ayarları",()->launch(android.provider.Settings.ACTION_SOUND_SETTINGS));button("Bildirim ayarları",()->launch(android.provider.Settings.ACTION_SETTINGS));break;
           }}
           void showApps(){Intent i=new Intent(Intent.ACTION_MAIN);i.addCategory(Intent.CATEGORY_LAUNCHER);List<ResolveInfo> all=getPackageManager().queryIntentActivities(i,0);for(ResolveInfo r:all){String label=r.loadLabel(getPackageManager()).toString();button(label,()->{Intent launch=getPackageManager().getLaunchIntentForPackage(r.activityInfo.packageName);if(launch!=null)startActivity(launch);});}}
           @Override protected void onActivityResult(int request,int result,Intent data){super.onActivityResult(request,result,data);if(result==RESULT_OK&&data!=null&&data.getData()!=null){Uri uri=data.getData();if(request==1){Intent i=new Intent(Intent.ACTION_VIEW);i.setDataAndType(uri,getContentResolver().getType(uri));i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);try{startActivity(i);}catch(Exception e){Toast.makeText(this,uri.toString(),Toast.LENGTH_LONG).show();}}else Toast.makeText(this,"Seçildi: "+uri,Toast.LENGTH_LONG).show();}}
          }'''
           java.joinpath("MainActivity.java").write_text(src.replace("PACKAGE",pkg).replace('h.setText("TITLE")','h.setText("'+title+'")').replace('switch("KIND")','switch("'+kind+'")'))
          
          PY
          python3 /tmp/create_apps.py
      - name: Build and package separate ZIPs
        shell: bash
        run: |
          mkdir -p artifacts logs
          failed=0
          for app in launcher files gallery settings control; do
            echo "::group::Build $app"
            if (cd "build-src/$app" && gradle --no-daemon --console=plain assembleDebug) > "logs/$app.log" 2>&1; then
              cp "build-src/$app/app/build/outputs/apk/debug/app-debug.apk" "artifacts/GameXOS-$app.apk"
              (cd artifacts && zip "GameXOS-$app.zip" "GameXOS-$app.apk")
              echo "SUCCESS: $app"
            else
              failed=1
              echo "::error title=GameXOS $app compile failed::Check compiler errors below"
              grep -n -E 'error:|FAILURE:|What went wrong|Execution failed' "logs/$app.log" | head -35 || true
            fi
            tail -35 "logs/$app.log"
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "Some apps failed; see GameXOS-Build-Logs artifact"
            exit 1
          fi
      - name: Upload build logs (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameXOS-Build-Logs
          path: logs/*.log
          if-no-files-found: warn
      - name: Upload each app ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameXOS-Five-Separate-App-ZIPs
          path: artifacts/*.zip
          if-no-files-found: warn
