name: GameXOS ISO readiness

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gamexos-iso.yml'
      - 'README.md'
      - 'device/**'
      - 'kernel/**'
      - 'initramfs/**'
      - 'system/**'
      - 'launcher/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual Android build inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          {
            echo '# GameXOS ISO readiness'
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo 'This is a source/input audit, NOT an Android boot test.'
            echo
            echo '| Required input | Present? |'
            echo '|---|---|'
            for path in kernel/bzImage initramfs/initramfs.cpio.gz system/system.img system/vendor.img uefi/EFI/BOOT/BOOTX64.EFI; do
              if [[ -s "$path" ]]; then status=YES; else status=NO; fi
              echo "| \`$path\` | $status |"
            done
            echo
            echo 'Even if these files exist, bootability requires an architecture-specific boot integration and VM validation.'
          } > out/ISO_READINESS.md
          cat out/ISO_READINESS.md
      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: gamexos-iso-readiness
          path: out/ISO_READINESS.md
