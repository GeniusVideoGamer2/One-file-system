name: TV+ Pro Full Edition APK Build
on:
  workflow_dispatch:
  push:
    branches: [tvplus-pro-15-android14]
    paths:
      - 'TVPlus-Pro-Full-Edition-15/**'
      - '.github/workflows/tvplus-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check project files
        run: |
          test -f TVPlus-Pro-Full-Edition-15/settings.gradle || test -f TVPlus-Pro-Full-Edition-15/settings.gradle.kts
      - name: Check optional Android QEMU 64-bit engines
        shell: bash
        run: |
          set -euo pipefail
          base="TVPlus-Pro-Full-Edition-15/unified/src/main/jniLibs"
          for abi in arm64-v8a x86_64; do
            bin="$base/$abi/libqemu-system-x86_64.so"
            if [ -f "$bin" ]; then
              echo "QEMU candidate for $abi: $bin"
              file "$bin"
              if ! file "$bin" | grep -q 'ELF 64-bit'; then
                echo "::error::Invalid ELF binary for $abi"
                exit 1
              fi
              case "$abi" in
                arm64-v8a) file "$bin" | grep -Eq 'ARM aarch64|ARM64' || { echo "::error::Wrong ABI for $abi"; exit 1; };;
                x86_64) file "$bin" | grep -q 'x86-64' || { echo "::error::Wrong ABI for $abi"; exit 1; };;
              esac
            else
              echo "::warning::QEMU engine missing for $abi; APK can build, but VM launch will be unavailable."
            fi
          done
      - name: Build Full Edition debug APK
        working-directory: TVPlus-Pro-Full-Edition-15
        run: gradle --no-daemon :full:assembleDebug :switcher:assembleDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TVPlus-Pro-Full-Edition-15-debug-apk
          path: TVPlus-Pro-Full-Edition-15/unified/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Launcher Switcher APK
        uses: actions/upload-artifact@v4
        with:
          name: TVPlus-Pro-Launcher-Switcher-debug-apk
          path: TVPlus-Pro-Full-Edition-15/switcher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
