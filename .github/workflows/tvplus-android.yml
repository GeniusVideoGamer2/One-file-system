name: TV+ Pro Unified APK Build
on:
  workflow_dispatch:
  push:
    branches: [tvplus-pro-15-android14]
    paths:
      - 'TVPlus-Pro-Full-Edition-15/**'
      - '.github/workflows/tvplus-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check project files
        run: |
          test -f TVPlus-Pro-Full-Edition-15/settings.gradle || test -f TVPlus-Pro-Full-Edition-15/settings.gradle.kts
      - name: Build unified debug APK
        working-directory: TVPlus-Pro-Full-Edition-15
        run: gradle --no-daemon :unified:assembleDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TVPlus-Pro-15-unified-debug-apk
          path: TVPlus-Pro-Full-Edition-15/unified/build/outputs/apk/debug/*.apk
          if-no-files-found: error
