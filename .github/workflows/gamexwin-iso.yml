name: Build GameXWIN ISO
on:
  workflow_dispatch:
  push:
    branches: [gamexwin-os-1.0]
jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc binutils grub-pc-bin grub-common xorriso mtools
      - name: Build ISO
        run: bash build.sh
      - name: Verify ISO exists
        run: test -s dist/GameXWIN-1.0.iso
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: GameXWIN-1.0-ISO
          path: dist/GameXWIN-1.0.iso
